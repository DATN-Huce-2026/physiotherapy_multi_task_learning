[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rehab-mtl"
version = "0.1.0"
description = "Multi-task skeleton models for rehabilitation exercise analysis"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
