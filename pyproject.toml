[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rehab-mtl"
version = "0.1.0"
description = "Multi-task skeleton models for rehabilitation exercise analysis"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "scipy>=1.10",
]

[project.optional-dependencies]
# scripts/assess_exercise.py: test một lần tập từ webcam/video
inference = ["mediapipe==0.10.14", "opencv-python>=4.8", "numpy<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
python-interpreter-path = ".venv/Scripts/python.exe"
search-path = ["src", "scripts", "scripts/keraal", "scripts/kimore"]
